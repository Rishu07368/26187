<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Border Surveillance</title>
<style>body{font:15px system-ui;background:#10151c;color:#eef;margin:0;padding:20px}h1{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}.card{background:#19232e;border:1px solid #304050;border-radius:8px;padding:14px}.feed{width:100%;background:#000;min-height:220px}.ok{color:#62e69a}.bad{color:#ff987f}.meta{display:flex;gap:14px;flex-wrap:wrap;color:#b8c8d8}.event{padding:8px;border-bottom:1px solid #304050}</style></head>
<body><h1>SIH26187 Border Surveillance <small>LIVE CCTV analytics</small></h1><div id="cameras" class="grid"></div><h2>EVENTS</h2><div id="events"></div>
<h2>ANPR</h2><div id="anpr">No plate observations yet.</div>
<script>
const cameras=document.querySelector('#cameras'),events=document.querySelector('#events');
function render(c){const live=c.connected&&c.last_frame_timestamp;const badge=c.source_type==='rtsp'?'RTSP / LIVE CAMERA':c.source_type==='webcam'?'WEBCAM / LIVE CAMERA':'FILE / DEMO';const v=c.vehicle_counts||{};return `<article class="card"><h2>${c.name}</h2><b class="${live?'ok':'bad'}">${live?'LIVE':'OFFLINE'}</b> <b>${badge}</b><img class="feed" src="/stream/${c.camera_id}"><div class="meta"><span>Resolution: ${c.resolution||'—'}</span><span>Capture FPS: ${c.capture_fps}</span><span>Processing FPS: ${c.processing_fps}</span><span>Face detections: ${c.faces_detected||0}</span><span>Associated faces: ${c.faces_associated||0}</span><span>Person tracks: ${Math.max(0,c.active_tracks-c.active_vehicle_tracks)}</span><span>Vehicle tracks: ${c.active_vehicle_tracks||0}</span><span>Cars: ${v.CAR||0}</span><span>Motorcycles: ${v.MOTORCYCLE||0}</span><span>Buses: ${v.BUS||0}</span><span>Trucks: ${v.TRUCK||0}</span><span>Detections: ${c.detection_count}</span></div></article>`}
async function refresh(){const r=await fetch('/cameras');cameras.innerHTML=(await r.json()).map(render).join('')||'<p>No enabled cameras. Configure cameras.json.</p>'}refresh();setInterval(refresh,2000);
async function refreshAnpr(){const r=await fetch('/cameras');const data=await r.json();const rows=data.flatMap(c=>c.anpr_observations||[]);document.querySelector('#anpr').innerHTML=rows.length?rows.map(x=>`${x.track_id} | ${x.vehicle_class} | ${x.plate||'READING...'} | ${x.ocr_confidence??'—'} | ${x.status}`).join('<br>'):'No plate observations yet.'}refreshAnpr();setInterval(refreshAnpr,2000);
async function loadEvents(){const r=await fetch('/events');(await r.json()).forEach(addEvent)} function addEvent(x){const label=x.event_type==='intrusion'?'INTRUSION':x.event_type;events.insertAdjacentHTML('beforeend',`<div class="event"><b>${x.timestamp}</b> ${label}<br>Camera: ${x.camera_id} | Track: #${x.track_id??'—'} | Zone: ${x.zone_id??'—'} | Object: ${x.object_class??'—'}</div>`)}loadEvents();
const ws=new WebSocket(`ws://${location.host}/alerts/live`);ws.onmessage=e=>{addEvent(JSON.parse(e.data))}
</script></body></html>
